<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>TypeScript Calculator</h1>
        
        <div class="display">
            <p class="display-input">0</p>
        </div>

        <div class="buttons-grid" id="buttons">
            <button class="special btn del">Del</button>
            <button class="special btn">C</button>
            <button class="special btn">%</button>
            <button class="operator btn">÷</button>
            <button class="num btn">7</button>
            <button class="num btn">8</button>
            <button class="num btn">9</button>
            <button class="operator btn">×</button>
            <button class="num btn">4</button>
            <button class="num btn">5</button>
            <button class="num btn">6</button>
            <button class="operator btn">-</button>
            <button class="num btn">1</button>
            <button class="num btn">2</button>
            <button class="num btn">3</button>
            <button class="operator btn">+</button>
            <button class="num btn">+/-</button>
            <button class="num btn">0</button>
            <button class="num btn">.</button>
            <button class="equal btn">=</button>
        </div>
    </div>

</body>
<script type="module" src="script.js" defer></script>
</html>
